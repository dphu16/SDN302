<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal To-Do List</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .todo-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
    }

    .header-title {
      font-size: 22px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 20px;
    }

    .todo-form {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .todo-input {
      flex: 1;
      padding: 12px 16px;
      font-size: 15px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    .todo-input:focus {
      border-color: #3b82f6;
    }

    .btn-add {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-add:hover {
      background: #2563eb;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #f8fafc;
      border: 1px solid #edf2f7;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .todo-content {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      cursor: pointer;
    }

    .todo-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #3b82f6;
    }

    .todo-text {
      font-size: 15px;
      color: #334155;
      user-select: none;
    }

    /* Class dùng khi JS đánh dấu hoàn thành */
    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-delete:hover {
      color: #ef4444;
      background: #fee2e2;
    }
  </style>
</head>
<body>

  <div class="todo-card">
    <h1 class="header-title">Danh sách công việc</h1>

    <form id="todo-form" class="todo-form">
      <input 
        type="text" 
        id="todo-input" 
        class="todo-input" 
        placeholder="Cần làm gì hôm nay?..." 
        autocomplete="off"
        required
      >
      <button type="submit" class="btn-add">Thêm</button>
    </form>

    <ul id="todo-list" class="todo-list">
      <!-- Dữ liệu mẫu tĩnh để xem trước style -->
      <li class="todo-item">
        <label class="todo-content">
          <input type="checkbox" class="todo-checkbox">
          <span class="todo-text">Học DOM Manipulation trong JS</span>
        </label>
        <button class="btn-delete" title="Xoá">&times;</button>
      </li>

      <li class="todo-item completed">
        <label class="todo-content">
          <input type="checkbox" class="todo-checkbox" checked>
          <span class="todo-text">Dựng khung HTML và CSS</span>
        </label>
        <button class="btn-delete" title="Xoá">&times;</button>
      </li>
    </ul>
  </div>

    <script src="script.js" defer></script>
</body>
</html>
